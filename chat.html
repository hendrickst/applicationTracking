<?xml version="1.0" encoding="UTF-8"?>
<html xmlns="http://www.w3.org/1999/xhtml" lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Job AI Chat</title>
<link rel="stylesheet" href="./resources/css/styles.css"/>
</head>
<body>
<div class="container chat-container">
  <div class="chat-topbar"><a class="btn" href="./index.html">← Applications</a><a id="editJobLink" class="btn" href="./update.html">Edit Job</a></div>
  <h1 id="chatTitle">Job AI Chat</h1>
  <p id="chatSubtitle" class="sub">A separate saved conversation for this application.</p>
    <details id="chatSettingsSection" class="card chat-settings-section"><summary>Gemini API Settings</summary><div class="chat-settings">
    <div class="field"><label for="apiKey">Gemini API key</label><input id="apiKey" type="password" autocomplete="off" placeholder="Paste your Google AI Studio API key"/></div>
    <div class="grid chat-settings-grid">
      <div class="field"><label for="model">Model</label><input id="model" value="gemini-3.5-flash-lite"/></div>
      <div class="field"><label for="temperature">Creativity (0–1)</label><input id="temperature" type="number" min="0" max="1" step="0.1" value="0.4"/></div>
    </div>
    <label class="consent-row"><input id="privacyConsent" type="checkbox"/> I understand that messages sent from this page go to Google's Gemini API and accept the free-tier data-use terms.</label>
    <div class="chat-settings-actions"><button id="saveSettingsBtn" type="button" class="btn">Save settings in this browser</button><span id="settingsStatus" class="muted">Your API key is stored in this browser only, not in eXist-db.</span></div>
  </div></details>
  <div id="chatMessages" class="chat-messages" aria-live="polite"><div class="chat-empty">Loading conversation…</div></div>
  <form id="chatForm" class="chat-composer">
    <label for="userMessage">Message</label>
    <textarea id="userMessage" rows="3" placeholder="Ask about interview preparation, recruiter follow-up, salary discussion, or next steps…" required></textarea>
    <div class="chat-composer-footer"><span id="chatStatus" class="muted">Conversation saves to this job's record.</span><button id="sendBtn" class="btn primary" type="submit">Send</button></div>
  </form>
  <div class="chat-footer-actions"><button id="copySummaryBtn" class="btn" type="button">Copy conversation summary</button><button id="clearChatBtn" class="btn danger" type="button">Clear conversation</button></div>
</div>
<script src="./resources/js/chat.js"></script>
</body>
</html>
