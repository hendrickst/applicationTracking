name: Build eXist-db XAR

on:
  workflow_dispatch:
  push:
    branches:
      - feature/application-document-storage

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out branch
        uses: actions/checkout@v6

      - name: Build package archive
        shell: bash
        run: |
          set -euo pipefail
          rm -rf xar-package
          mkdir xar-package
          rsync -a --exclude='.git/' --exclude='.github/' --exclude='xar-package/' ./ xar-package/
          cd xar-package
          zip -qr ../applicationTracking.xar .

      - name: Upload XAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: applicationTracking-xar
          path: applicationTracking.xar
          if-no-files-found: error
          retention-days: 30
